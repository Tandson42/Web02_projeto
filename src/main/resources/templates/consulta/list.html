<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: layout(~{::head}, ~{::main})}">

    <head th:replace="~{fragments/head :: head(~{::title})}">
        <title>Consultas</title>
    </head>

    <main th:fragment="main">
        <div class="container mt-4">
            <!-- Mensagem flash enviada após cadastro/edição bem-sucedidos -->
            <div class="alert alert-success shadow-sm d-flex align-items-center gap-2 mb-3" th:if="${mensagem != null}">
                <i class="bi bi-check-circle-fill"></i>
                <span th:text="${mensagem}"></span>
            </div>

            <!-- Cabeçalho da página -->
            <div class="page-header">
                <div>
                    <h2 class="page-title">Consultas</h2>
                    <p class="text-secondary mb-0">Agendamentos e histórico clínico geral.</p>
                </div>
                <!-- Link para abrir o formulário de cadastro de uma nova consulta -->
                <a th:href="@{/consulta/form}" class="btn btn-info text-white">
                    <i class="bi bi-calendar-plus-fill"></i> Nova Consulta
                </a>
            </div>

            <div class="table-responsive">
                <table class="table align-middle">
                    <thead>
                    <tr>
                        <th style="width: 70px;">Id</th>
                        <th>Data</th>
                        <th>Valor</th>
                        <th>Observação</th>
                        <th>Paciente</th>
                        <th>Médico</th>
                        <th class="text-end" style="min-width: 160px;">Ações</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:if="${#lists.isEmpty(consultas)}">
                        <td colspan="7" class="text-center py-4 text-muted">Nenhuma consulta agendada até o momento.</td>
                    </tr>
                    <tr th:each="c : ${consultas}">
                        <td class="text-muted fw-bold" th:text="${c.id}"></td>
                        <td class="fw-semibold text-dark">
                            <i class="bi bi-clock me-1 text-info"></i>
                            <span th:text="${#temporals.format(c.data, 'dd/MM/yyyy HH:mm')}"></span>
                        </td>
                        <td>
                            <span class="badge bg-success bg-opacity-10 text-success fw-bold px-2 py-1"
                                  th:text="${'R$ ' + #numbers.formatDecimal(c.valor, 1, 'POINT', 2, 'COMMA')}"></span>
                        </td>
                        <td class="text-secondary small" th:text="${c.observacao}"></td>
                        <td class="fw-semibold" th:text="${c.paciente?.nome}"></td>
                        <td><span class="badge bg-light text-dark border" th:text="${c.medico?.nome}"></span></td>

                        <td class="text-end">
                            <div class="btn-group btn-group-sm">
                                <a th:href="|/consulta/edit/${c.id}|" class="btn btn-outline-secondary btn-sm" title="Editar">
                                    <i class="bi bi-pencil"></i> Editar
                                </a>
                                <a onclick="return window.confirm('Tem certeza que deseja excluir este registro?')"
                                   th:href="@{/consulta/remove/{id}(id=${c.id})}" class="btn btn-outline-danger btn-sm" title="Excluir">
                                    <i class="bi bi-trash"></i> Excluir
                                </a>
                            </div>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>
</html>
