<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      th:replace="~{fragments/layout :: layout(~{::head}, ~{::main})}">

    <head th:replace="~{fragments/head :: head(~{::title})}">
        <title>Horários Disponíveis</title>
    </head>

    <main th:fragment="main">
        <div class="container mt-4">
            <div class="alert alert-success shadow-sm d-flex align-items-center gap-2 mb-3" th:if="${mensagem != null}">
                <i class="bi bi-check-circle-fill"></i>
                <span th:text="${mensagem}"></span>
            </div>
            <div class="alert alert-danger shadow-sm d-flex align-items-center gap-2 mb-3" th:if="${erro != null}">
                <i class="bi bi-exclamation-triangle-fill"></i>
                <span th:text="${erro}"></span>
            </div>

            <div class="page-header">
                <div>
                    <h2 class="page-title">Horários Disponíveis</h2>
                    <p class="text-secondary mb-0">
                        Selecione um horário livre na agenda para realizar o agendamento.
                    </p>
                </div>
                <div class="d-flex gap-2 flex-wrap">
                    <a th:href="@{/agendamento/list}" class="btn btn-outline-secondary">
                        <i class="bi bi-journal-check"></i> Ver Agendamentos
                    </a>
                    <a sec:authorize="hasAnyRole('MEDICO', 'SECRETARIO', 'ADMIN')"
                       th:href="@{/agenda/form}" class="btn btn-info text-white">
                        <i class="bi bi-plus-circle-fill"></i> Novo Horário
                    </a>
                </div>
            </div>

            <div class="table-responsive">
                <table class="table align-middle">
                    <thead>
                    <tr>
                        <th>Médico</th>
                        <th>CRM</th>
                        <th>Data</th>
                        <th>Horário</th>
                        <th>Valor</th>
                        <th>Situação</th>
                        <th class="text-end" style="min-width: 150px;">Ação</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:if="${#lists.isEmpty(agendas)}">
                        <td colspan="7" class="text-center py-4 text-muted">
                            Não há horários disponíveis para agendamento no momento.
                        </td>
                    </tr>
                    <tr th:each="a : ${agendas}">
                        <td class="fw-semibold text-dark">
                            <i class="bi bi-person-badge me-1 text-info"></i>
                            <span th:text="${a.medico?.nome}"></span>
                        </td>
                        <td><span class="badge bg-light text-dark border" th:text="${a.medico?.crm}"></span></td>
                        <td>
                            <i class="bi bi-calendar-event me-1 text-info"></i>
                            <span th:text="${#temporals.format(a.data, 'dd/MM/yyyy')}"></span>
                        </td>
                        <td class="fw-semibold">
                            <i class="bi bi-clock me-1 text-info"></i>
                            <span th:text="${#temporals.format(a.horario, 'HH:mm')}"></span>
                        </td>
                        <td>
                            <span class="badge bg-success bg-opacity-10 text-success fw-bold px-2 py-1"
                                  th:text="${'R$ ' + #numbers.formatDecimal(a.medico.valorConsulta, 1, 'POINT', 2, 'COMMA')}"></span>
                        </td>
                        <td>
                            <span class="badge bg-success bg-opacity-10 text-success px-2 py-1">
                                <i class="bi bi-check-circle me-1"></i> Disponível
                            </span>
                        </td>
                        <td class="text-end">
                            <a sec:authorize="hasAnyRole('PACIENTE', 'SECRETARIO', 'ADMIN')"
                               th:href="@{/agendamento/novo/{id}(id=${a.id})}"
                               class="btn btn-info text-white btn-sm">
                                <i class="bi bi-calendar-plus"></i> Agendar
                            </a>
                            <span sec:authorize="hasRole('MEDICO') and !hasAnyRole('SECRETARIO', 'ADMIN')"
                                  class="text-muted small">
                                Livre para pacientes
                            </span>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>
</html>
