<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Login - Clínica Web</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-rbsA2VBKQhggwzxH7pPCaAqO46MgnOM80zW1RWuH61DGLwZJEdK2Kadq2F9CUG65" crossorigin="anonymous">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="d-flex align-items-center justify-content-center min-vh-100 py-5" style="background: radial-gradient(circle at 50% 20%, #e0f2fe 0%, #f8fafc 70%);">
<main class="container">
    <div class="row justify-content-center">
        <div class="col-sm-10 col-md-6 col-lg-5 col-xl-4">

            <div class="text-center mb-4">
                <div class="d-inline-flex align-items-center justify-content-center rounded-circle bg-white shadow-sm p-3 mb-2" style="width: 64px; height: 64px;">
                    <i class="bi bi-heart-pulse-fill fs-2" style="color: var(--primary);"></i>
                </div>
                <h2 class="fw-bold mb-1" style="letter-spacing: -0.02em;">Clínica Web</h2>
                <p class="text-muted small">Portal de Acesso Seguro</p>
            </div>

            <div th:if="${param.error}" class="alert alert-danger shadow-sm border-0 d-flex align-items-center gap-2">
                <i class="bi bi-exclamation-triangle-fill"></i>
                <span>Usuário ou senha inválidos.</span>
            </div>
            <div th:if="${param.logout}" class="alert alert-success shadow-sm border-0 d-flex align-items-center gap-2">
                <i class="bi bi-check-circle-fill"></i>
                <span>Você saiu do sistema.</span>
            </div>

            <div class="card shadow-lg border-0 mb-4">
                <div class="card-body p-4">
                    <h1 class="h5 fw-bold mb-3 text-center">Informe usuário e senha</h1>
                    <form th:action="@{/login}" method="post">
                        <div class="mb-3">
                            <label for="username" class="form-label">Usuário</label>
                            <div class="input-group">
                                <span class="input-group-text bg-light border-end-0 text-muted"><i class="bi bi-person"></i></span>
                                <input id="username" name="username" class="form-control border-start-0 ps-0"
                                       placeholder="Seu usuário" required autofocus autocomplete="username">
                            </div>
                        </div>
                        <div class="mb-3">
                            <label for="password" class="form-label">Senha</label>
                            <div class="input-group">
                                <span class="input-group-text bg-light border-end-0 text-muted"><i class="bi bi-lock"></i></span>
                                <input id="password" name="password" type="password" class="form-control border-start-0 ps-0"
                                       placeholder="Sua senha" required autocomplete="current-password">
                            </div>
                        </div>
                        <div class="form-check mb-4">
                            <input id="remember-me" name="remember-me" type="checkbox" class="form-check-input">
                            <label for="remember-me" class="form-check-label text-muted small">Lembrar de mim</label>
                        </div>
                        <button type="submit" class="btn btn-info w-100 py-2 fs-6">
                            <i class="bi bi-box-arrow-in-right"></i> Entrar
                        </button>
                    </form>
                </div>
            </div>

            <!-- Demonstração rápida de perfis -->
            <div class="card border-0 bg-white bg-opacity-75 shadow-sm p-3 small text-muted">
                <div class="d-flex align-items-center gap-2 fw-semibold mb-2 text-dark">
                    <i class="bi bi-key-fill text-info"></i> Contas de Demonstração
                </div>
                <div class="row g-2">
                    <div class="col-6"><strong>admin</strong> / admin <span class="badge bg-danger bg-opacity-10 text-danger ms-1">Admin</span></div>
                    <div class="col-6"><strong>secretario</strong> / 123 <span class="badge bg-warning bg-opacity-10 text-dark ms-1">Secretário</span></div>
                    <div class="col-6"><strong>carlos</strong> / 123 <span class="badge bg-primary bg-opacity-10 text-primary ms-1">Médico</span></div>
                    <div class="col-6"><strong>user</strong> / 123 <span class="badge bg-success bg-opacity-10 text-success ms-1">Paciente</span></div>
                </div>
            </div>

        </div>
    </div>
</main>
</body>
</html>
