<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: layout(~{::head}, ~{::main})}">

    <head th:replace="~{fragments/head :: head(~{::title})}">
        <title>Editar Usuário</title>
    </head>

    <main th:fragment="main">
        <div class="container mt-4">
            <div class="row justify-content-center">
                <div class="col-lg-6 col-md-8">
                    <div class="card shadow-sm border-0">
                        <div class="card-header bg-white py-3">
                            <h3 class="h5 mb-0 fw-bold"><i class="bi bi-shield-lock me-2 text-info"></i> Editar usuário</h3>
                        </div>
                        <div class="card-body p-4">
                            <form th:action="@{/usuario/update}" th:object="${usuarioForm}" method="post">
                                <div class="alert alert-danger shadow-sm d-flex align-items-center gap-2 mb-3" th:if="${#fields.hasAnyErrors()}">
                                    <i class="bi bi-exclamation-triangle-fill"></i>
                                    <div>
                                        <div th:each="erro : ${#fields.detailedErrors()}">
                                            <span th:text="${erro.message}"></span>
                                        </div>
                                    </div>
                                </div>

                                <input type="hidden" th:field="*{id}"/>

                                <div class="mb-3">
                                    <label class="form-label" for="usuario">Usuário</label>
                                    <input type="text" class="form-control" id="usuario"
                                           th:field="*{usuario}" th:errorclass="is-invalid"
                                           autocomplete="username"/>
                                    <div class="invalid-feedback" th:if="${#fields.hasErrors('usuario')}"
                                         th:errors="*{usuario}"></div>
                                </div>

                                <div class="mb-3">
                                    <label class="form-label">Papéis de Acesso</label>
                                    <div class="border rounded p-3 bg-light">
                                        <div class="form-check mb-2" th:each="perfil : ${perfis}">
                                            <input class="form-check-input" type="checkbox" name="perfis"
                                                   th:id="|perfil-${perfil.id}|"
                                                   th:value="${perfil.id}"
                                                   th:checked="${#lists.contains(usuarioForm.perfis, perfil.id)}"/>
                                            <label class="form-check-label fw-semibold" th:for="|perfil-${perfil.id}|"
                                                   th:text="${perfil.nome}">PERFIL</label>
                                        </div>
                                    </div>
                                    <div class="text-danger small mt-1" th:if="${#fields.hasErrors('perfis')}"
                                         th:errors="*{perfis}"></div>
                                </div>

                                <div class="mb-4">
                                    <label class="form-label" for="senha">Nova senha (deixe em branco para manter)</label>
                                    <input type="password" class="form-control" id="senha" name="senha"
                                           autocomplete="new-password"
                                           placeholder="••••••••"
                                           th:classappend="${#fields.hasErrors('senha')} ? 'is-invalid'"/>
                                    <div class="invalid-feedback" th:if="${#fields.hasErrors('senha')}"
                                         th:errors="*{senha}"></div>
                                    <div class="form-text text-muted small"><i class="bi bi-info-circle me-1"></i> A senha deve ter no mínimo 6 caracteres se for alterada.</div>
                                </div>

                                <div class="d-flex gap-2">
                                    <button type="submit" class="btn btn-info text-white">
                                        <i class="bi bi-check2-circle"></i> Salvar
                                    </button>
                                    <a th:href="@{/usuario/list}" class="btn btn-outline-secondary">
                                        <i class="bi bi-x-circle"></i> Cancelar
                                    </a>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>
</html>
