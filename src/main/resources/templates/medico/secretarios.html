<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: layout(~{::head}, ~{::main})}">

    <head th:replace="~{fragments/head :: head(~{::title})}">
        <title>Meus Secretários</title>
    </head>

    <main th:fragment="main">
        <div class="container mt-4">
            <div class="alert alert-success shadow-sm d-flex align-items-center gap-2 mb-3" th:if="${mensagem != null}">
                <i class="bi bi-check-circle-fill"></i>
                <span th:text="${mensagem}"></span>
            </div>
            <div class="alert alert-danger shadow-sm d-flex align-items-center gap-2 mb-3" th:if="${erro != null}">
                <i class="bi bi-exclamation-triangle-fill"></i>
                <span th:text="${erro}"></span>
            </div>

            <div class="page-header">
                <div>
                    <h2 class="page-title">Meus Secretários e Permissões</h2>
                    <p class="text-secondary mb-0">
                        Controle quais secretários associados podem alterar sua agenda ou o preço da sua consulta.
                    </p>
                </div>
                <div class="d-flex gap-2 flex-wrap">
                    <a th:href="@{/medico/preco/{id}(id=${medico.id})}" class="btn btn-outline-success">
                        <i class="bi bi-cash-coin"></i> Preço Atual:
                        <strong th:text="${'R$ ' + #numbers.formatDecimal(medico.valorConsulta, 1, 'POINT', 2, 'COMMA')}"></strong>
                    </a>
                    <a th:href="@{/agenda/list}" class="btn btn-info text-white">
                        <i class="bi bi-calendar-week"></i> Minha Agenda
                    </a>
                </div>
            </div>

            <!-- Associar novo secretário -->
            <div class="card shadow-sm border-0 mb-4" th:if="${!#lists.isEmpty(secretariosDisponiveis)}">
                <div class="card-body">
                    <form th:action="@{/medico/secretarios/adicionar}" method="post" class="row g-2 align-items-end">
                        <input type="hidden" name="origem" value="secretarios"/>
                        <div class="col-md-8">
                            <label class="form-label fw-semibold" for="secretarioId">Associar novo secretário</label>
                            <select class="form-select" id="secretarioId" name="secretarioId" required>
                                <option value="">Selecione um secretário...</option>
                                <option th:each="sec : ${secretariosDisponiveis}"
                                        th:value="${sec.id}"
                                        th:text="${sec.usuario}"></option>
                            </select>
                        </div>
                        <div class="col-md-4">
                            <button type="submit" class="btn btn-info text-white w-100">
                                <i class="bi bi-person-plus-fill"></i> Associar Secretário
                            </button>
                        </div>
                    </form>
                </div>
            </div>

            <!-- Lista de secretários associados com os dois botões Ativar/Desligar -->
            <div class="table-responsive">
                <table class="table align-middle">
                    <thead>
                    <tr>
                        <th>Secretário</th>
                        <th>Alterar Agenda</th>
                        <th>Alterar Preço da Consulta</th>
                        <th class="text-end" style="width: 130px;">Vínculo</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:if="${#lists.isEmpty(vinculos)}">
                        <td colspan="4" class="text-center py-4 text-muted">
                            Nenhum secretário associado a você no momento.
                        </td>
                    </tr>
                    <tr th:each="v : ${vinculos}">
                        <td class="fw-semibold text-dark">
                            <i class="bi bi-person-badge me-2 text-info"></i>
                            <span th:text="${v.secretario.usuario}"></span>
                        </td>
                        <td>
                            <div class="d-flex align-items-center gap-2 flex-wrap">
                                <span th:if="${v.podeAlterarAgenda}" class="badge bg-success bg-opacity-10 text-success px-2 py-1">
                                    <i class="bi bi-check-circle-fill me-1"></i> Ativado
                                </span>
                                <span th:if="${!v.podeAlterarAgenda}" class="badge bg-secondary bg-opacity-10 text-secondary px-2 py-1">
                                    <i class="bi bi-slash-circle me-1"></i> Desligado
                                </span>

                                <form th:action="@{/medico/secretarios/{id}/permissao-agenda(id=${v.id})}" method="post">
                                    <input type="hidden" name="origem" value="secretarios"/>
                                    <button type="submit"
                                            th:class="${v.podeAlterarAgenda} ? 'btn btn-outline-danger btn-sm' : 'btn btn-success btn-sm'">
                                        <i th:class="${v.podeAlterarAgenda} ? 'bi bi-toggle-on me-1' : 'bi bi-toggle-off me-1'"></i>
                                        <span th:text="${v.podeAlterarAgenda} ? 'Desligar' : 'Ativar'"></span>
                                    </button>
                                </form>
                            </div>
                        </td>
                        <td>
                            <div class="d-flex align-items-center gap-2 flex-wrap">
                                <span th:if="${v.podeAlterarPreco}" class="badge bg-success bg-opacity-10 text-success px-2 py-1">
                                    <i class="bi bi-check-circle-fill me-1"></i> Ativado
                                </span>
                                <span th:if="${!v.podeAlterarPreco}" class="badge bg-secondary bg-opacity-10 text-secondary px-2 py-1">
                                    <i class="bi bi-slash-circle me-1"></i> Desligado
                                </span>

                                <form th:action="@{/medico/secretarios/{id}/permissao-preco(id=${v.id})}" method="post">
                                    <input type="hidden" name="origem" value="secretarios"/>
                                    <button type="submit"
                                            th:class="${v.podeAlterarPreco} ? 'btn btn-outline-danger btn-sm' : 'btn btn-success btn-sm'">
                                        <i th:class="${v.podeAlterarPreco} ? 'bi bi-toggle-on me-1' : 'bi bi-toggle-off me-1'"></i>
                                        <span th:text="${v.podeAlterarPreco} ? 'Desligar' : 'Ativar'"></span>
                                    </button>
                                </form>
                            </div>
                        </td>
                        <td class="text-end">
                            <form th:action="@{/medico/secretarios/{id}/remover(id=${v.id})}" method="post"
                                  onsubmit="return window.confirm('Deseja desvincular este secretário?')">
                                <input type="hidden" name="origem" value="secretarios"/>
                                <button type="submit" class="btn btn-outline-danger btn-sm">
                                    <i class="bi bi-trash"></i> Remover
                                </button>
                            </form>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>
</html>
