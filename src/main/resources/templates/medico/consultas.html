<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      th:replace="~{fragments/layout :: layout(~{::head}, ~{::main})}">

    <head th:replace="~{fragments/head :: head(~{::title})}">
        <title>Consultas do Médico</title>
    </head>

    <main th:fragment="main">
        <div class="container mt-4">
            <div class="page-header">
                <div>
                    <h2 class="page-title">Consultas do Dr(a). <span th:text="${medico?.nome}"></span></h2>
                    <p class="text-secondary mb-0" th:text="${medico?.dados()}"></p>
                </div>
            </div>

            <div class="table-responsive">
                <table class="table align-middle">
                    <thead>
                    <tr>
                        <th style="width: 70px;">Id</th>
                        <th>Data</th>
                        <th>Valor</th>
                        <th>Observação</th>
                        <th>Paciente</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:if="${#lists.isEmpty(consultas)}">
                        <td colspan="5" class="text-center py-4 text-muted">Nenhuma consulta realizada até o momento.</td>
                    </tr>
                    <tr th:each="c : ${consultas}">
                        <td class="text-muted fw-bold" th:text="${c.id}"></td>
                        <td class="fw-semibold text-dark">
                            <i class="bi bi-calendar2-event me-1 text-info"></i>
                            <span th:text="${#temporals.format(c.data, 'dd/MM/yyyy HH:mm')}"></span>
                        </td>
                        <td>
                            <span class="badge bg-success bg-opacity-10 text-success fw-bold px-2 py-1"
                                  th:text="${'R$ ' + #numbers.formatDecimal(c.valor, 1, 'POINT', 2, 'COMMA')}"></span>
                        </td>
                        <td class="text-secondary small" th:text="${c.observacao}"></td>
                        <td>
                            <i class="bi bi-person me-1 text-secondary"></i>
                            <span class="fw-semibold" th:text="${c.paciente?.nome}"></span>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>

            <div class="mt-4">
                <a sec:authorize="hasAnyRole('SECRETARIO', 'ADMIN')" th:href="@{/medico/list}" class="btn btn-outline-secondary">
                    <i class="bi bi-arrow-left"></i> Voltar para a lista de médicos
                </a>
                <a sec:authorize="!hasAnyRole('SECRETARIO', 'ADMIN')" th:href="@{/}" class="btn btn-outline-secondary">
                    <i class="bi bi-arrow-left"></i> Voltar ao Menu
                </a>
            </div>
        </div>
    </main>
</html>
