
<header class="container" th:fragment="header" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

    <nav class="navbar navbar-expand-lg navbar-dark bg-info">
        <div class="container-fluid">
            <a class="navbar-brand" th:href="@{/}">Clínica Web</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarSupportedContent">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/}">Home</a>
                    </li>
                    <li class="nav-item" sec:authorize="hasRole('ADMIN')">
                        <a class="nav-link" th:href="@{/medico/list}">Médicos</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/paciente/list}">Pacientes</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/consulta/list}">Consultas</a>
                    </li>
                </ul>

                <span class="navbar-text me-3" sec:authorize="isAuthenticated()">
                    Olá, <strong sec:authentication="name">usuário</strong>
                </span>

                <a class="btn btn-outline-light me-2" sec:authorize="!isAuthenticated()" th:href="@{/login}">Entrar</a>

                <form class="d-flex" sec:authorize="isAuthenticated()" th:action="@{/logout}" method="post">
                    <button type="submit" class="btn btn-outline-light">Sair</button>
                </form>
            </div>
        </div>
    </nav>

</header>
