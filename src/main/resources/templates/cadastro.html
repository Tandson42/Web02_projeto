<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Cadastro de Paciente - Clínica Web</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-rbsA2VBKQhggwzxH7pPCaAqO46MgnOM80zW1RWuH61DGLwZJEdK2Kadq2F9CUG65" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="d-flex align-items-center justify-content-center min-vh-100 py-5" style="background: radial-gradient(circle at 50% 20%, #e0f2fe 0%, #f8fafc 70%);">
<main class="container">
    <div class="row justify-content-center">
        <div class="col-md-8 col-lg-7 col-xl-6">

            <div class="text-center mb-4">
                <div class="d-inline-flex align-items-center justify-content-center rounded-circle bg-white shadow-sm p-3 mb-2" style="width: 60px; height: 60px;">
                    <i class="bi bi-heart-pulse-fill fs-2" style="color: var(--primary);"></i>
                </div>
                <h2 class="fw-bold mb-1" style="letter-spacing: -0.02em;">Criar Conta de Paciente</h2>
                <p class="text-muted small">Preencha seus dados para agendar e acompanhar suas consultas</p>
            </div>

            <div class="card shadow-lg border-0">
                <div class="card-body p-4">
                    <form th:action="@{/cadastro}" th:object="${paciente}" method="post">
                        <div class="alert alert-danger shadow-sm d-flex align-items-center gap-2 mb-3"
                             th:if="${#fields.hasAnyErrors()}">
                            <i class="bi bi-exclamation-triangle-fill"></i>
                            <div>
                                <div th:each="erro : ${#fields.detailedErrors()}">
                                    <span th:text="${erro.message}"></span>
                                </div>
                            </div>
                        </div>

                        <h6 class="text-uppercase text-secondary fw-bold small mb-3">
                            <i class="bi bi-person-vcard me-1"></i> Dados Pessoais
                        </h6>

                        <div class="row g-3 mb-4">
                            <div class="col-md-7">
                                <label class="form-label" for="nome">Nome Completo</label>
                                <input type="text" class="form-control" id="nome"
                                       th:field="*{nome}" th:errorclass="is-invalid"
                                       placeholder="Seu nome completo" required autofocus/>
                                <div class="invalid-feedback" th:if="${#fields.hasErrors('nome')}"
                                     th:errors="*{nome}"></div>
                            </div>

                            <div class="col-md-5">
                                <label class="form-label" for="cpf">CPF</label>
                                <input type="text" class="form-control" id="cpf"
                                       th:field="*{cpf}" th:errorclass="is-invalid"
                                       placeholder="000.000.000-00" required/>
                                <div class="invalid-feedback" th:if="${#fields.hasErrors('cpf')}"
                                     th:errors="*{cpf}"></div>
                            </div>

                            <div class="col-md-7">
                                <label class="form-label" for="email">E-mail</label>
                                <input type="email" class="form-control" id="email"
                                       th:field="*{email}" th:errorclass="is-invalid"
                                       placeholder="seu@email.com" required/>
                                <div class="invalid-feedback" th:if="${#fields.hasErrors('email')}"
                                     th:errors="*{email}"></div>
                            </div>

                            <div class="col-md-5">
                                <label class="form-label" for="telefone">Telefone</label>
                                <input type="text" class="form-control" id="telefone"
                                       th:field="*{telefone}" th:errorclass="is-invalid"
                                       placeholder="(00) 00000-0000" required/>
                                <div class="invalid-feedback" th:if="${#fields.hasErrors('telefone')}"
                                     th:errors="*{telefone}"></div>
                            </div>
                        </div>

                        <h6 class="text-uppercase text-secondary fw-bold small mb-3">
                            <i class="bi bi-shield-lock me-1"></i> Dados de Acesso
                        </h6>

                        <div class="row g-3 mb-4 p-3 bg-light rounded border">
                            <div class="col-md-6">
                                <label class="form-label" for="login">Usuário</label>
                                <input type="text" class="form-control" id="login"
                                       th:field="*{login}" th:errorclass="is-invalid"
                                       autocomplete="username" placeholder="ex.: maria.silva" required/>
                                <div class="invalid-feedback" th:if="${#fields.hasErrors('login')}"
                                     th:errors="*{login}"></div>
                            </div>

                            <div class="col-md-6">
                                <label class="form-label" for="senha">Senha</label>
                                <input type="password" class="form-control" id="senha" name="senha"
                                       autocomplete="new-password" placeholder="Mínimo 6 caracteres"
                                       th:classappend="${#fields.hasErrors('senha')} ? 'is-invalid'" required/>
                                <div class="invalid-feedback" th:if="${#fields.hasErrors('senha')}"
                                     th:errors="*{senha}"></div>
                            </div>
                        </div>

                        <button type="submit" class="btn btn-info w-100 py-2 fs-6">
                            <i class="bi bi-person-plus-fill"></i> Criar Minha Conta
                        </button>
                    </form>

                    <div class="text-center mt-3 pt-3 border-top small text-muted">
                        Já possui cadastro?
                        <a th:href="@{/login}" class="fw-semibold text-decoration-none text-info">Voltar para o login</a>
                    </div>
                </div>
            </div>

        </div>
    </div>
</main>
</body>
</html>
